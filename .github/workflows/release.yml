name: Release

# 推送 v* 标签（如 v0.1.0）或在 Actions 页手动触发，即构建 Windows 安装包并发布 Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本标签（如 v0.1.0）"
        required: true

jobs:
  release-windows:
    runs-on: windows-latest
    permissions:
      contents: write # 创建 Release、上传安装包需要
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 编译缓存
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: 安装前端依赖
        run: npm ci

      - name: 构建并发布（Windows 安装包）
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 默认服务端地址由**构建期**注入，源码里一个字符都不写（公开仓库不暴露运维拓扑，
          # 克隆仓库自己编译的人也不会莫名其妙连到官方服务器上）。
          # 在仓库 Settings → Secrets and variables → Actions 里配 ITOOLS_DEFAULT_ENDPOINT，
          # 形如 https://你的域名:端口（**端口不能省**）。
          # 没配这个 secret 时构建照常成功，只是发行版没有默认地址——
          # 用户需在「设置 → 网络」自己填，界面会如实显示「云端未接入」。
          ITOOLS_DEFAULT_ENDPOINT: ${{ secrets.ITOOLS_DEFAULT_ENDPOINT }}
        with:
          tagName: ${{ github.event.inputs.version || github.ref_name }}
          releaseName: "iTools ${{ github.event.inputs.version || github.ref_name }}"
          releaseBody: |
            iTools —— macOS 风格的键盘驱动效率启动器（Windows）。

            本 Release 由 GitHub Actions 自动构建，附件为 Windows 安装包（.msi / .exe 安装程序）。
          releaseDraft: false
          prerelease: false
