<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>API 自检</title>
<style>
  body { font: 13px/1.6 system-ui, "Segoe UI", sans-serif; margin: 0; padding: 14px; background: #1c1c1e; color: #eee; }
  h1 { font-size: 15px; margin: 0 0 10px; }
  #sum { margin-bottom: 10px; color: #9be; }
  .row { display: flex; gap: 8px; padding: 2px 0; border-bottom: 1px solid #2c2c2e; }
  .n { width: 210px; color: #bbb; flex: none; }
  .ok { color: #4caf50; width: 42px; flex: none; }
  .no { color: #f5455f; width: 42px; flex: none; }
  .sk { color: #888; width: 42px; flex: none; }
  .d { color: #999; word-break: break-all; }
</style>
</head>
<body>
<h1>window.itools API 自检</h1>
<div id="sum">运行中…</div>
<div id="list"></div>
<script>
(function () {
  "use strict";
  var results = [];
  var listEl = document.getElementById("list");
  var sumEl = document.getElementById("sum");

  function show(r) {
    var d = document.createElement("div");
    d.className = "row";
    var cls = r.status === "ok" ? "ok" : (r.status === "skip" ? "sk" : "no");
    var mark = r.status === "ok" ? "PASS" : (r.status === "skip" ? "SKIP" : "FAIL");
    d.innerHTML = '<span class="n"></span><span class="' + cls + '"></span><span class="d"></span>';
    d.children[0].textContent = r.name;
    d.children[1].textContent = mark;
    d.children[2].textContent = r.detail || "";
    listEl.appendChild(d);
  }

  // 每项独立超时，避免某个 API 卡住让整轮拿不到任何结果
  function withTimeout(p, ms) {
    return new Promise(function (resolve, reject) {
      var done = false;
      var t = setTimeout(function () {
        if (!done) { done = true; reject(new Error("超时 " + ms + "ms")); }
      }, ms);
      Promise.resolve(p).then(function (v) {
        if (!done) { done = true; clearTimeout(t); resolve(v); }
      }, function (e) {
        if (!done) { done = true; clearTimeout(t); reject(e); }
      });
    });
  }

  function brief(v) {
    try {
      if (v === undefined) return "undefined";
      if (v === null) return "null";
      if (typeof v === "string") return v.length > 120 ? v.slice(0, 120) + "…(" + v.length + ")" : v;
      if (v instanceof ArrayBuffer) return "ArrayBuffer(" + v.byteLength + ")";
      var s = JSON.stringify(v);
      return s.length > 900 ? s.slice(0, 900) + "…" : s;
    } catch (e) { return "<无法序列化>"; }
  }

  // fn 返回值；verify 可选，返回 true 表示结果符合预期
  async function t(name, fn, verify, timeoutMs) {
    var r = { name: name, status: "fail", detail: "" };
    try {
      var v = await withTimeout(fn(), timeoutMs || 8000);
      if (verify) {
        var okv = false;
        try { okv = !!verify(v); } catch (e) { okv = false; }
        r.status = okv ? "ok" : "fail";
        r.detail = (okv ? "" : "返回值不符合预期: ") + brief(v);
      } else {
        r.status = "ok";
        r.detail = brief(v);
      }
    } catch (e) {
      r.status = "fail";
      r.detail = String((e && e.message) || e);
    }
    results.push(r); show(r); return r;
  }

  function skip(name, why) {
    var r = { name: name, status: "skip", detail: why };
    results.push(r); show(r);
  }

  var it = window.itools;

  async function runAll() {
    if (!it) { sumEl.textContent = "window.itools 不存在！"; return; }

    // ---------- 基础（既有能力，作为对照组）----------
    await t("platform", async () => it.platform, v => v && typeof v.isWindows === "boolean");
    await t("db.set/get", async () => { await it.db.set("k1", { a: 1 }); return await it.db.get("k1"); }, v => v && v.a === 1);
    await t("data.set/get", async () => { await it.data.set("k2", "v2"); return await it.data.get("k2"); }, v => v === "v2");
    await t("copyText/readText", async () => { await it.copyText("apitest-clip"); return await it.readText(); }, v => v === "apitest-clip");
    await t("account.state", async () => await it.account.state(), v => v && typeof v.loggedIn === "boolean");
    await t("settings.all", async () => await it.settings.all(), v => typeof v === "object");

    // ---------- 浏览器级存储隔离（本轮修复项）----------
    await t("Web 存储进入即清空", async () => {
      var before = window.localStorage.length;
      window.localStorage.setItem("leak-probe", "x");
      return { entryCount: before, canWrite: window.localStorage.getItem("leak-probe") === "x" };
    }, v => v.entryCount === 0);

    // ---------- 图像处理（无需授权）----------
    var pngB64 = null;
    await t("image.info", async () => {
      // 1x1 红点 PNG
      pngB64 = "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==";
      return await it.image.info(pngB64);
    }, v => v && v.width === 1 && v.height === 1);
    await t("image.resize", async () => await it.image.resize(pngB64, 8, 8, "fill"), v => typeof v === "string" && v.length > 20);
    await t("image.convert(jpeg)", async () => await it.image.convert(pngB64, "jpeg"), v => typeof v === "string" && v.length > 20);
    await t("image.crop", async () => await it.image.crop(pngB64, 0, 0, 1, 1), v => typeof v === "string" && v.length > 20);

    // ---------- 屏幕辅助 ----------
    await t("screen.cursorPoint", async () => await it.screen.cursorPoint(), v => v && typeof v.x === "number");
    await t("screen.toDip", async () => await it.screen.toDip(100, 100), v => v && typeof v.x === "number");
    await t("screen.toPhysical", async () => await it.screen.toPhysical(100, 100), v => v && typeof v.x === "number");
    await t("screen.rectToDip", async () => await it.screen.rectToDip(0, 0, 100, 100), v => v && typeof v.width === "number");
    await t("listDisplays", async () => await it.listDisplays(), v => Array.isArray(v) && v.length > 0);
    await t("screen.pickColorAt", async () => await it.screen.pickColorAt(10, 10), v => v && typeof v.hex === "string");

    // ---------- 系统信息 ----------
    await t("sys.info", async () => await it.sys.info(), v => v && typeof v.osVersion === "string" && v.memoryTotalBytes > 0);
    await t("sys.usage", async () => await it.sys.usage(), v => v && typeof v.cpuPercent === "number" && v.memoryUsedBytes > 0, 12000);
    await t("sys.getPath(temp)", async () => await it.sys.getPath("temp"), v => typeof v === "string" && v.length > 2);
    await t("sys.getPath(downloads)", async () => await it.sys.getPath("downloads"), v => typeof v === "string" && v.length > 2);

    // ---------- SQLite ----------
    var h = null;
    await t("sqlite.open", async () => { h = await it.sqlite.open("t1"); return h; }, v => typeof v === "string" && v.length > 0);
    if (h) {
      await t("sqlite.exec(建表)", async () => await it.sqlite.exec(h, "CREATE TABLE IF NOT EXISTS a(id INTEGER PRIMARY KEY, s TEXT)"), () => true);
      await t("sqlite.exec(插入)", async () => await it.sqlite.exec(h, "INSERT INTO a(s) VALUES(?)", ["hello"]), v => v >= 1);
      await t("sqlite.query", async () => await it.sqlite.query(h, "SELECT s FROM a WHERE s=?", ["hello"]), v => Array.isArray(v) && v.length > 0 && v[0].s === "hello");
      await t("sqlite.batch", async () => await it.sqlite.batch(h, [{ sql: "INSERT INTO a(s) VALUES(?)", params: ["b1"] }, { sql: "INSERT INTO a(s) VALUES(?)", params: ["b2"] }]), () => true);
      // 隔离红线：ATTACH 必须被拒
      await t("sqlite 禁 ATTACH（应失败）", async () => {
        try { await it.sqlite.exec(h, "ATTACH DATABASE 'x.db' AS x"); return "未被拒绝"; }
        catch (e) { return "已拒绝: " + String((e && e.message) || e); }
      }, v => String(v).indexOf("已拒绝") === 0);
      await t("sqlite.close", async () => await it.sqlite.close(h), () => true);
    }

    // ---------- 加密存储 / 附件 ----------
    await t("crypto.set/get", async () => { await it.crypto.set("secret", { token: "abc123" }); return await it.crypto.get("secret"); }, v => v && v.token === "abc123");
    await t("crypto.keys", async () => await it.crypto.keys(), v => Array.isArray(v));
    await t("attach.put/get", async () => { await it.attach.put("blob1", pngB64, "image/png"); return await it.attach.get("blob1"); }, v => v && v.dataB64 === pngB64 && v.mime === "image/png" && v.size > 0);
    await t("attach.list", async () => await it.attach.list(), v => Array.isArray(v));

    // ---------- 沙盒文件（既有）----------
    await t("writeFile/readFile", async () => { await it.writeFile("probe.txt", "hello-sandbox"); return await it.readFile("probe.txt"); }, v => v === "hello-sandbox");

    // ---------- 执行外部程序 ----------
    await t("exec(echo)", async () => await it.exec("cmd", ["/c", "echo", "itools-exec-ok"]),
      v => v && v.code === 0 && String(v.stdout).indexOf("itools-exec-ok") >= 0);
    await t("exec(中文/GBK 解码)", async () => await it.exec("cmd", ["/c", "echo", "中文测试"]),
      v => v && String(v.stdout).indexOf("中文测试") >= 0);
    await t("exec(超时被杀)", async () => await it.exec("cmd", ["/c", "ping", "-n", "10", "127.0.0.1"], { timeoutMs: 1200 }),
      v => v && v.timedOut === true, 15000);
    await t("execStream", async () => {
      return await new Promise(function (resolve, reject) {
        var buf = "";
        it.execStream("cmd", ["/c", "echo", "stream-ok"], null, {
          onData: function (d) { buf += d; },
          onExit: function (code) { resolve({ code: code, out: buf }); }
        }).catch(reject);
      });
    }, v => v && v.code === 0 && v.out.indexOf("stream-ok") >= 0, 15000);

    // ---------- 命名系统位置 / 回收站 ----------
    await t("paths.resolve(temp)", async () => await it.paths.resolve("temp"), v => Array.isArray(v) && v.length > 0 && v[0].path);
    await t("paths.resolve(downloads)", async () => await it.paths.resolve("downloads"), v => Array.isArray(v) && v.length > 0);
    await t("paths.resolve(browserCache)", async () => await it.paths.resolve("browserCache"), v => Array.isArray(v));
    await t("paths.scan(temp)", async () => await it.paths.scan("temp", { maxDepth: 1, maxItems: 20 }), v => v && typeof v.fileCount === "number", 20000);
    // trash：先用 exec 造一个临时文件，再送回收站，最后确认文件真的没了
    await t("trash(送回收站)", async () => {
      var tmp = await it.sys.getPath("temp");
      // 反斜杠用字符码拼，免得在多层转义里被吃掉（上一轮就是这么拼出 `Tempitools-…` 的）
      var f = tmp + String.fromCharCode(92) + "itools-trash-probe.txt";
      // 用 `cmd /c copy nul <file>`：每个参数独立传递，不依赖 shell 解析引号——
      // exec 是直接 spawn 不经 cmd.exe 的，带引号的整串命令在这里并不可靠。
      var mk = await it.exec("cmd", ["/c", "copy", "/y", "nul", f]);
      // 用 dir 的退出码判断存在与否：每个参数独立传递，不需要 cmd 解析复合语句
      var before = await it.exec("cmd", ["/c", "dir", "/b", f]);
      var r = await it.trash([f]);
      var after = await it.exec("cmd", ["/c", "dir", "/b", f]);
      return {
        mkCode: mk.code, mkOut: String(mk.stdout || "").trim(), mkErr: String(mk.stderr || "").trim(),
        beforeExists: before.code === 0,
        afterExists: after.code === 0,
        path: f,
        result: r
      };
    }, v => v.beforeExists === true && v.afterExists === false, 25000);

    // ---------- 上下文感知 ----------
    await t("context.activeWindow", async () => {
      var w = await it.context.activeWindow();
      return w === null ? "null（后台启动时尚无前台窗口记录，属预期降级）" : w;
    }, v => v === null || typeof v === "string" || (v && typeof v.app === "string"));
    await t("context.browserUrl", async () => await it.context.browserUrl(), () => true);
    await t("context.folderPath", async () => await it.context.folderPath(), () => true);

    // ---------- 窗口管理 ----------
    var winList = null;
    await t("win.list", async () => { winList = await it.win.list(); return winList; }, v => Array.isArray(v) && v.length > 0);
    await t("win.getForeground", async () => await it.win.getForeground(), v => v === null || (v && typeof v.hwnd === "number"));
    await t("win.list 不含 iTools 自身", async () => {
      if (!winList) return "无列表";
      var self = winList.filter(function (w) { return String(w.app || "").toLowerCase().indexOf("itools") >= 0; });
      return { total: winList.length, selfCount: self.length };
    }, v => v && v.selfCount === 0);

    // ---------- 网络 ----------
    await t("fetch(可达目标)", async () => await it.fetch("http://127.0.0.1:7346/"),
      v => v && typeof v.status === "number" && v.status > 0, 12000);
    await t("download 取消", async () => {
      var id = "dl-" + Date.now();
      var p = it.download("http://127.0.0.1:1/x", "dl.bin", id);
      await it.downloadCancel(id);
      try { await p; return "未取消"; } catch (e) { return "已结束: " + String((e && e.message) || e); }
    }, v => String(v).indexOf("已结束") === 0, 20000);

    // ---------- 进程 / 已装软件 / 启动项 ----------
    await t("proc.list", async () => await it.proc.list(), v => Array.isArray(v) && v.length > 5, 20000);
    await t("proc.kill 保护全部 iTools 实例（应失败）", async () => {
      var list = await it.proc.list();
      var self = list.filter(function (p) { return String(p.name || "").toLowerCase().indexOf("itools") >= 0; });
      if (self.length === 0) return "找不到 iTools 进程";
      var errs = [];
      for (var i = 0; i < self.length; i++) {
        try { await it.proc.kill(self[i].pid); errs.push("pid " + self[i].pid + " 未被拒绝"); }
        catch (e) { /* 被拒是预期 */ }
      }
      return errs.length ? errs.join("; ") : "全部已拒绝(" + self.length + " 个实例)";
    }, v => String(v).indexOf("全部已拒绝") === 0, 25000);
    await t("proc.kill 对普通进程有效", async () => {
      // 用 ping 起一个必定存在、生命周期够长、杀掉也完全无害的进程
      await it.exec("powershell", ["-NoProfile", "-Command",
        "Start-Process ping -ArgumentList '-n','60','127.0.0.1' -WindowStyle Hidden"]);
      await new Promise(function (r) { setTimeout(r, 1800); });
      var list = await it.proc.list();
      var np = list.filter(function (p) { return String(p.name || "").toLowerCase() === "ping.exe"; });
      if (np.length === 0) return "没起来 ping.exe，无法验证";
      await it.proc.kill(np[0].pid);
      await new Promise(function (r) { setTimeout(r, 1200); });
      var after = await it.proc.list();
      var still = after.filter(function (p) { return p.pid === np[0].pid; });
      return { killedPid: np[0].pid, stillAlive: still.length > 0 };
    }, v => v && v.stillAlive === false, 30000);
    await t("installedApps", async () => await it.installedApps(), v => Array.isArray(v) && v.length > 0, 25000);
    await t("startup.list", async () => await it.startup.list(), v => Array.isArray(v), 20000);

    // ---------- 托管运行时 ----------
    await t("runtime.list", async () => await it.runtime.list(), v => Array.isArray(v) && v.length > 0);
    // 真装一个最小的运行时，验证「下载 → SHA-256 校验 → 落盘 → 可执行」整条链路
    await t("runtime.ensure(yt-dlp 真实安装)", async () => {
      var prog = [];
      await it.runtime.ensure("yt-dlp", function (p) { prog.push(p); });
      var list = await it.runtime.list();
      var y = list.filter(function (r) { return r.name === "yt-dlp"; })[0];
      return { installed: y && y.installed, progressEvents: prog.length };
    }, v => v && v.installed === true, 240000);
    await t("runtime.exec(yt-dlp --version)", async () => await it.runtime.exec("yt-dlp", ["--version"]),
      v => v && v.code === 0 && /^\d{4}\.\d{2}\.\d{2}/.test(String(v.stdout).trim()), 60000);
    // ffmpeg 约 160MB，下载慢；它是 mp4 录屏的前置依赖
    // 进度记到外层：即使 ensure 超时，也能从这里看出到底下了多少、速度如何
    var ffProg = { events: 0, received: 0, total: null, t0: Date.now(), tLast: 0 };
    await t("runtime.ensure(ffmpeg 真实安装)", async () => {
      await it.runtime.ensure("ffmpeg", function (p) {
        ffProg.events++;
        if (p && typeof p.received === "number") ffProg.received = p.received;
        if (p && p.total) ffProg.total = p.total;
        ffProg.tLast = Date.now() - ffProg.t0;
      });
      var list = await it.runtime.list();
      var m = list.filter(function (r) { return r.name === "ffmpeg"; })[0];
      return { installed: m && m.installed, sizeBytes: m && m.sizeBytes };
    }, v => v && v.installed === true, 600000);
    await t("ffmpeg 下载进度诊断", async () => {
      var secs = ffProg.tLast / 1000;
      return {
        events: ffProg.events,
        receivedBytes: ffProg.received,
        totalBytes: ffProg.total,
        elapsedSec: Math.round(secs * 10) / 10,
        bytesPerSec: secs > 0 ? Math.round(ffProg.received / secs) : 0
      };
      // events 为 0 表示本轮 ffmpeg 已经装好、根本没走下载路径，属正常
    }, v => v && (v.events === 0 || v.receivedBytes > 0), 15000);
    await t("runtime.exec(ffmpeg -version)", async () => await it.runtime.exec("ffmpeg", ["-version"]),
      v => v && v.code === 0 && String(v.stdout).indexOf("ffmpeg version") >= 0, 60000);

    await t("runtime 拒绝未知运行时", async () => {
      try { await it.runtime.exec("definitely-not-a-runtime", []); return "未被拒绝"; }
      catch (e) { return "已拒绝: " + String((e && e.message) || e); }
    }, v => String(v).indexOf("已拒绝") === 0, 15000);

    // ---------- 本地服务 / 局域网 ----------
    await t("lan.discover", async () => await it.lan.discover(800), v => Array.isArray(v), 12000);

    // ---------- 摄像头 ----------
    var camId = null;
    await t("camera.list", async () => {
      var l = await it.camera.list();
      if (Array.isArray(l) && l.length > 0) camId = l[0].deviceId;
      return l;
    }, v => Array.isArray(v), 15000);
    if (camId) {
      await t("camera.grab(取单帧)", async () => await it.camera.grab(camId),
        v => typeof v === "string" && v.length > 2000, 25000);
      await t("camera.streamStart/Stop(收帧)", async () => {
        // grab 刚用完设备，留点时间让它释放，免得 stream 抢不到
        await new Promise(function (r) { setTimeout(r, 1200); });
        var frames = 0, stoppedReason = null;
        var sid = await it.camera.streamStart(camId, { fps: 5 }, {
          onFrame: function () { frames++; },
          onStopped: function (reason) { stoppedReason = reason; }
        });
        await new Promise(function (r) { setTimeout(r, 3000); });
        var stopErr = null;
        try { await it.camera.streamStop(sid); } catch (e) { stopErr = String((e && e.message) || e); }
        return { streamId: sid, frames: frames, stoppedReason: stoppedReason, stopErr: stopErr };
      }, v => v && v.frames > 0, 45000);
    } else {
      skip("camera.grab / streamStart", "本机未枚举到摄像头设备");
    }

    // ---------- 音频 ----------
    await t("录音 start/stop", async () => {
      await it.startAudioRecord();
      await new Promise(function (r) { setTimeout(r, 600); });
      var buf = await it.stopAudioRecord();
      return buf;
    }, v => v && (v.byteLength > 44), 20000);
    await t("系统内录 start/stop", async () => {
      await it.record.loopbackStart();
      await new Promise(function (r) { setTimeout(r, 1200); });
      return await it.record.loopbackStop();
    }, v => v && (v.byteLength > 44 || (typeof v === "string" && v.length > 40)), 25000);

    // ---------- 截图 / OCR ----------
    await t("captureFull", async () => await it.captureFull(), v => v && v.byteLength > 1000, 20000);

    // ---------- 压缩 ----------
    await t("zip/unzip 需 scope（应报错）", async () => {
      try { await it.fs.zipCreate("bogus-scope", ["a"], "out.zip"); return "未被拒绝"; }
      catch (e) { return "已拒绝: " + String((e && e.message) || e); }
    }, v => String(v).indexOf("已拒绝") === 0);

    // ---------- 动态指令 ----------
    await t("setFeature/getFeatures", async () => {
      await it.setFeature({ code: "dyn1", explain: "动态条目", cmds: ["apitest-dyn"] });
      return await it.getFeatures();
    }, v => Array.isArray(v) && v.some(function (f) { return f.code === "dyn1"; }));
    await t("removeFeature", async () => await it.removeFeature("dyn1"), v => v === true);

    // ---------- 通知 / 托盘 ----------
    await t("notifyShow", async () => await it.notifyShow({ title: "API 自检", body: "通知通道验证", silent: true }), () => true, 12000);
    await t("tray.set/remove", async () => {
      await it.tray.set({ icon: pngB64, tooltip: "apitest", menu: [{ id: "m1", label: "菜单项" }] });
      await new Promise(function (r) { setTimeout(r, 300); });
      return await it.tray.remove();
    }, () => true, 15000);

    // ---------- 剪贴板监听 ----------
    // 断言必须落在「事件真的到了」上：原来写的是 () => true，那种断言即使 onChange
    // 一次都不触发也照样绿——而本插件是后台常驻形态（mainPush），历史上宿主正是把事件
    // 推给了写死的 `plugin` 窗口，后台窗口一条都收不到。这条用例就是钉住那个回归的。
    await t("clipboard.onChange(后台窗口收得到)", async () => {
      var hits = 0;
      it.clipboard.onChange(function () { hits++; });
      await it.clipboard.watchStart();
      await new Promise(function (r) { setTimeout(r, 400); });
      await it.copyText("apitest-clip-watch-" + Date.now());
      // 宿主是 300ms 轮询，给足 8 秒
      for (var i = 0; i < 40 && hits === 0; i++) {
        await new Promise(function (r) { setTimeout(r, 200); });
      }
      await it.clipboard.watchStop();
      return { events: hits, window: (location && location.search) || "" };
    }, v => v && v.events > 0, 20000);

    // ---------- 输入注入（只做无害验证）----------
    await t("input.keyTap 非法键名应被拒", async () => {
      try { await it.input.keyTap("f15", []); return "未被拒绝"; }
      catch (e) { return "已拒绝: " + String((e && e.message) || e); }
    }, v => String(v).indexOf("已拒绝") === 0, 8000);
    await t("input.mouseMove(原地，验证 SendInput 通路)", async () => {
      var p0 = await it.screen.cursorPoint();
      await it.input.mouseMove(p0.x, p0.y);
      var p1 = await it.screen.cursorPoint();
      return { before: p0, after: p1 };
    }, v => v && Math.abs(v.after.x - v.before.x) <= 2 && Math.abs(v.after.y - v.before.y) <= 2, 10000);

    // ---------- MCP 工具注册 ----------
    await t("registerTool", async () => {
      return await it.registerTool("echo_test", function (params) { return { echoed: params && params.text }; });
    }, () => true, 10000);

    // ---------- 搜索结果注入 ----------
    await t("onMainPush 注册", async () => {
      return await it.onMainPush(function (q) { return [{ title: "注入结果：" + q, payload: q }]; });
    }, () => true, 10000);

    // ---------- mp4 录屏（依赖上面装好的 ffmpeg）----------
    await t("record.videoStart/Stop(出 mp4)", async () => {
      var prog = [];
      var rid = await it.record.videoStart({ fps: 10 }, function (p) { prog.push(p); });
      await new Promise(function (r) { setTimeout(r, 4000); });
      var path = await it.record.videoStop(rid);
      // 用 exec 复核产出文件真实存在且非空
      var probe = await it.exec("cmd", ["/c", "dir", "/b", "/-c", path]);
      return { recordId: rid, path: path, progressEvents: prog.length, dirCode: probe.code, dirOut: String(probe.stdout||"").trim() };
    }, v => v && v.dirCode === 0 && v.progressEvents > 0, 180000);

    // ---------- 需要人工交互，自动批跳过 ----------
    // fs.pickDir 会弹原生对话框；验收时由外部脚本自动填路径回车（见验收报告）。
    // 拿到 scope 后连带验证整条链路：枚举 → 写 → 读 → 哈希 → 压缩 → 解压 → 本地服务。
    var scopeId = null;
    await t("fs.pickDir(自动应答对话框)", async () => {
      var sc = await it.fs.pickDir({ title: "APITEST-PICKDIR" });
      if (sc && sc.id) scopeId = sc.id;
      // 顺带把「对外暴露的路径不带 \\?\ 扩展长度前缀」钉成断言：上一轮真机拿到的正是
      // \\?\F:\... 这种形式，插件把它转给 shell 类 API（openPath / trash）会直接失败。
      // 前缀用字符码拼（92 = 反斜杠，63 = 问号），免得在 HTML 里被多层转义吃掉。
      var pfx = String.fromCharCode(92, 92, 63, 92);
      return {
        id: sc && sc.id, path: sc && sc.path, label: sc && sc.label,
        noExtendedPrefix: !!(sc && sc.path && sc.path.indexOf(pfx) !== 0)
      };
    }, v => v && typeof v.id === "string" && v.path && v.noExtendedPrefix === true, 70000);

    if (scopeId) {
      await t("fs.write/read(经 scope)", async () => {
        var b64 = btoa("scope-roundtrip");
        await it.fs.write(scopeId, "apitest-scope.txt", b64);
        var back = await it.fs.read(scopeId, "apitest-scope.txt");
        return { wrote: b64, read: back, same: back === b64 };
      }, v => v && v.same === true, 20000);
      await t("fs.list(经 scope)", async () => await it.fs.list(scopeId),
        v => Array.isArray(v) && v.some(function (e) { return e.name === "apitest-scope.txt"; }), 20000);
      await t("fs.stat / fs.hash", async () => {
        var st = await it.fs.stat(scopeId, "apitest-scope.txt");
        var h = await it.fs.hash(scopeId, "apitest-scope.txt", "sha256");
        return { size: st && st.size, hash: h };
      }, v => v && v.size > 0 && typeof v.hash === "string" && v.hash.length === 64, 20000);
      await t("fs.zipCreate/unzip(经 scope)", async () => {
        await it.fs.zipCreate(scopeId, ["apitest-scope.txt"], "apitest.zip");
        var r = await it.fs.unzip(scopeId, "apitest.zip", "apitest-unzipped");
        return r;
      }, v => v && v.extractedFiles >= 1, 30000);
      await t("fs.listScopes(持久化)", async () => await it.fs.listScopes(),
        v => Array.isArray(v) && v.some(function (x) { return x.id === scopeId; }), 15000);
      await t("serve.start/stop(局域网服务)", async () => {
        var sv = await it.serve.start({ scopeId: scopeId, readOnly: true, ttlSecs: 60 });
        // 用宿主的 fetch 打自己起的服务，确认真的在监听
        var url = sv.urls && sv.urls.length ? sv.urls[0] : ("http://127.0.0.1:" + sv.port + "/");
        var probe = null;
        try { probe = await it.fetch(url); } catch (e) { probe = { status: -1, err: String(e) }; }
        var list = await it.serve.list();
        await it.serve.stop(sv.serveId);
        return { port: sv.port, urlCount: (sv.urls || []).length, probeStatus: probe && probe.status, listed: list.length };
      }, v => v && v.port > 0 && v.probeStatus > 0, 40000);
      await t("fs.revokeScope", async () => await it.fs.revokeScope(scopeId), () => true, 15000);
    } else {
      skip("fs.* 全链路 / serve.start", "未能拿到 scope（对话框未被自动应答）");
    }
    skip("captureRegion", "需人工框选");
    skip("power.*", "会真的关机/重启/锁屏，不在自检范围");
    skip("startup.remove / setEnabled", "会真的改用户启动项，不在自检范围");
    skip("input.typeString / paste*", "会向当前焦点窗口真实输入，需在受控目标上人工验证");

    // ---------- 汇总 ----------
    var pass = results.filter(function (r) { return r.status === "ok"; }).length;
    var fail = results.filter(function (r) { return r.status === "fail"; }).length;
    var sk = results.filter(function (r) { return r.status === "skip"; }).length;
    var summary = { pass: pass, fail: fail, skip: sk, total: results.length, ts: new Date().toISOString(), results: results };
    sumEl.textContent = "PASS " + pass + " / FAIL " + fail + " / SKIP " + sk;
    try { await it.writeFile("result.json", JSON.stringify(summary, null, 2)); } catch (e) {
      sumEl.textContent += "（结果写盘失败：" + e + "）";
    }
    it.setHeight(Math.min(900, 120 + results.length * 26));
  }

  // 只跑一次：本插件声明了 mainPush，会被自动后台拉起；用户之后手动唤起时会复用同一实例
  // 并再次触发 onEnter，不设这个闸门就会重复跑一整轮。
  var started = false;
  it && it.onEnter(function () {
    if (started) return;
    started = true;
    runAll();
  });
  window.addEventListener("keydown", function (e) { if (e.key === "Escape") it.hide(); });
})();
</script>
</body>
</html>
