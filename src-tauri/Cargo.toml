[package]
name = "itools"
version = "1.5.0"
description = "iTools — macOS 风格的效率启动器"
authors = ["haifeng"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "itools_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# 自备 Windows 应用清单资源（理由见 build.rs::emit_app_manifest）。
# tauri-build → tauri-winres 已经依赖同一版本，显式声明不引入新的编译单元。
embed-resource = "3"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
# preserve_order：改写 AI 客户端的 MCP 配置时要原样保留用户其余键的顺序。
# `~/.claude.json` 有 100KB+ 全是它自己的运行状态，键序被打乱虽不改变语义，
# 却会让用户完全看不出我们到底动了哪一处。
serde_json = { version = "1", features = ["preserve_order"] }
# Codex 的 MCP 配置是 TOML（`[mcp_servers.<name>]`）。用 toml_edit 而不是 toml：
# 前者**保留注释与原有格式**，只改我们那一段——用户在 config.toml 里写的注释不能被吃掉。
toml_edit = "0.22"
walkdir = "2"
fuzzy-matcher = "0.3"
dirs = "5"
opener = "0.7"
window-vibrancy = "0.7"
fasteval = "0.2"
pinyin = { version = "0.11", default-features = false, features = ["plain", "heteronym"] }
arboard = "3"
chrono = "0.4"
png = "0.17"
base64 = "0.22"
image = "0.25"
winreg = "0.55"
rfd = "0.15"
regex = "1"
# 出站 HTTP（全应用唯一出口见 src/http.rs：代理 / 绕过规则都在那里）。
#
# `socks-proxy`：SOCKS 代理支持（`socks*://`，形态清单见 `http::normalize_proxy`）。
#
# ⚠ **勘误（2026-08-12）——上一轮「这个 feature 会做出跑不起来的二进制」是误判，别照着它退回去。**
# 当时的现象是真的：`cargo test -j1 --lib` 产出的 exe 一启动就退，`0xC0000139`
# （STATUS_ENTRYPOINT_NOT_FOUND）。但归因错了，真实原因与 socks 无关——
# lib 的单测二进制拿不到应用清单，于是 `comctl32` v6 里的 `TaskDialogIndirect`
# （由 `rfd` 引入）解析不到（详见 `build.rs::emit_app_manifest`，已持久修复）。
# 复现证据：依赖树里**根本没有** socks（`cargo tree -i socks` 查无此包）时同样崩；
# 给那个 exe 用 mt.exe 塞一份 Common-Controls 6.0.0.0 清单，**带着 socks** 也全绿。
# 上一轮的 A/B 对照之所以看起来成立，是因为两边真实差异是「测试二进制有没有被重新链接」
# ——去掉 feature 那次复用了旧的、恰好带清单的二进制。
#
# 📌 教训：**再遇到测试二进制启动即崩，先查清单，再怀疑依赖。**
# 加载期错误（0xC000013x）与业务代码、与刚加的那个依赖，通常都没有关系。
ureq = { version = "2", features = ["json", "socks-proxy"] }
# 插件 Git 安装：解 zip 归档（Gitee/GitHub 的 archive 都是 deflate zip）。
# default-features = false 去掉 aes/bzip2/zstd/时间戳等无用后端，只留 deflate（flate2 已在依赖树里）。
zip = { version = "2", default-features = false, features = ["deflate"] }
# 插件包内容校验（sha256）：镜像源可篡改内容，有可信哈希时必须校验。
# 已在依赖树里（rusqlite/tauri 传递依赖），显式声明不引入新的编译单元。
sha2 = "0.10"
# 统一本地存储：单个 SQLite 库（bundled 自带 SQLite，无系统依赖，Windows 直接编译）
rusqlite = { version = "0.32", features = ["bundled"] }
# 原生屏幕/窗口捕获（Windows.Graphics.Capture 底层，无 PowerShell/无杀软木马指纹）
xcap = "0.9"
# 已随 tauri 编译；直接声明以用 oneshot(框选结果) 与 time(隐藏面板延时)
tokio = { version = "1", features = ["sync", "time"] }
# 麦克风/系统声录音（WASAPI 底层）
cpal = "0.15"
tiny_http = { version = "0.12.0", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
] }
# 复用 tauri 已锁定的 windows 0.61.3（勿写 0.62+，否则与 tauri 分裂成两份）
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_Search",
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    # IShellLinkW::GetPath 的 WIN32_FIND_DATAW（解析 .lnk 指向的真实目标，用于去掉图标上的快捷方式箭头）
    # 另供 MFT 直读用 CreateFileW 打开卷设备（\\.\C:）与 GetVolumeInformationW 认 NTFS
    "Win32_Storage_FileSystem",
    # ↓ 以下 8 项为「全盘文件名秒搜」（直读 NTFS MFT，见 src/search/mft/）所需
    # FSCTL_ENUM_USN_DATA / FSCTL_READ_USN_JOURNAL 及其结构体
    # （MFT_ENUM_DATA_V0 / READ_USN_JOURNAL_DATA_V0 / USN_JOURNAL_DATA_V0 / USN_RECORD_V2 / USN_REASON_*）
    "Win32_System_Ioctl",
    # DeviceIoControl：上面那些 FSCTL 的唯一下发通道
    "Win32_System_IO",
    # CreateNamedPipeW / ConnectNamedPipe：主进程 ↔ 提权索引守护的命名管道（见 mft/ipc.rs）
    "Win32_System_Pipes",
    # SECURITY_ATTRIBUTES / TOKEN_USER / TOKEN_ELEVATION / GetTokenInformation：
    # 给管道设 SDDL（只放行当前用户）+ 守护进程自检是否真的提权
    "Win32_Security",
    # ConvertStringSecurityDescriptorToSecurityDescriptorW（SDDL→SD）/ ConvertSidToStringSidW（SID→管道名）
    "Win32_Security_Authorization",
    # OpenProcessToken / GetCurrentProcess：取当前进程令牌（上面两项都要用）
    "Win32_System_Threading",
    # SW_HIDE：ShellExecuteW("runas") 提权拉起守护时不闪窗口
    "Win32_UI_WindowsAndMessaging",
    # DRIVE_FIXED（只索引本地固定盘，跳过网络盘/光驱/U 盘）。
    # ⚠ 微软把这个常量放在 WindowsProgramming 而**不是** Storage_FileSystem 里，
    # 且它是裸 u32（无 newtype，别写 `DRIVE_FIXED.0`）；GetDriveTypeW 本身在 FileSystem。
    # 该 feature 目前已被依赖树里别的 crate 顺带打开，这里显式声明是为了不靠别人的 feature 活着。
    "Win32_System_WindowsProgramming",
    # WinRT：离线 OCR（Windows.Media.Ocr）
    "Foundation",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage_Streams",
] }

# debug 构建的调试信息等级。
#
# 默认的 `debug = 2`（完整变量信息）会让 `cargo build` 直接把 rustc 压垮：
# 2026-08-17 实测报 `STATUS_ACCESS_VIOLATION (0xc0000005)`，换个时机报
# `rustc-LLVM ERROR: out of memory`——都发生在 **lib 这个编译单元**上，它要同时产
# staticlib + cdylib + rlib 三份产物，而 `windows` crate 那一大堆 feature 生成的类型
# 会让调试信息体量再翻几倍。（`cargo test` 反而没事，它不产 cdylib/staticlib。）
#
# `line-tables-only` 保留**文件名 + 行号**，panic 回溯、`RUST_BACKTRACE`、断点定位都照常，
# 只是看不到局部变量的值。真要逐变量调试某个模块时，临时把这里改回 2 并只编那一个 crate。
[profile.dev]
debug = "line-tables-only"

[profile.release]
codegen-units = 1
lto = false
opt-level = "s"
panic = "abort"
strip = true
