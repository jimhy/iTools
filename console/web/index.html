<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>iTools 运营控制台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%232276ff'/%3E%3Ctext x='16' y='22' font-family='system-ui,sans-serif' font-size='15' font-weight='700' fill='white' text-anchor='middle'%3EiT%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="app.css">
</head>
<body>

<!-- 登录页。未登录时显示，登录成功后整块隐藏。 -->
<div id="login" class="login-wrap" hidden>
  <form class="login-card" id="login-form" autocomplete="on">
    <div class="login-brand">
      <div class="login-logo">iT</div>
      <div>
        <h1>iTools 运营控制台</h1>
        <p id="login-sub">正在连接服务端…</p>
      </div>
    </div>
    <label class="field">
      <span>用户名</span>
      <input id="login-user" name="username" autocomplete="username" autocapitalize="off" spellcheck="false" required>
    </label>
    <label class="field">
      <span>口令</span>
      <input id="login-pass" name="password" type="password" autocomplete="current-password" required>
    </label>
    <div class="login-error" id="login-error" hidden></div>
    <button class="btn btn-primary btn-block" id="login-submit" type="submit">登录</button>
    <p class="login-foot">控制台账号与 iTools 云账号相互独立，请使用运营方发放的账号。</p>
  </form>
</div>

<!-- 强制改密页。首次登录 / 被超管重置口令后进入。 -->
<div id="pwchange" class="login-wrap" hidden>
  <form class="login-card" id="pw-form">
    <div class="login-brand">
      <div class="login-logo">!</div>
      <div>
        <h1>请先修改口令</h1>
        <p>这是初始口令或由他人重置的口令，必须改掉才能继续。</p>
      </div>
    </div>
    <label class="field">
      <span>当前口令</span>
      <input id="pw-old" type="password" autocomplete="current-password" required>
    </label>
    <label class="field">
      <span>新口令</span>
      <input id="pw-new" type="password" autocomplete="new-password" required>
      <em class="field-hint">至少 8 个字符，需同时包含字母与非字母字符</em>
    </label>
    <label class="field">
      <span>确认新口令</span>
      <input id="pw-new2" type="password" autocomplete="new-password" required>
    </label>
    <div class="login-error" id="pw-error" hidden></div>
    <button class="btn btn-primary btn-block" id="pw-submit" type="submit">保存并继续</button>
    <button class="btn btn-ghost btn-block" id="pw-logout" type="button">退出登录</button>
  </form>
</div>

<!-- 主界面 -->
<div id="app" class="shell" hidden>
  <aside class="side">
    <div class="side-brand">
      <div class="side-logo">iT</div>
      <div class="side-title">
        <strong>运营控制台</strong>
        <span id="side-version">—</span>
      </div>
    </div>
    <nav class="side-nav" id="nav"></nav>
    <div class="side-foot">
      <button class="btn btn-ghost btn-sm" id="theme-toggle" type="button" title="切换亮/暗色">◐ 主题</button>
      <div class="side-user">
        <span id="who-name">—</span>
        <em id="who-role">—</em>
      </div>
      <button class="btn btn-ghost btn-sm" id="logout" type="button">退出登录</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div>
        <h2 id="page-title">概览</h2>
        <p id="page-sub"></p>
      </div>
      <div class="topbar-actions" id="page-actions"></div>
    </header>
    <div class="content" id="view"></div>
  </main>
</div>

<div class="toast-host" id="toasts"></div>

<!-- 通用确认对话框。危险操作一律走它，不用浏览器原生 confirm。 -->
<dialog class="modal" id="confirm-dialog">
  <form method="dialog" class="modal-body">
    <h3 id="confirm-title">确认操作</h3>
    <div id="confirm-text" class="modal-text"></div>
    <label class="field" id="confirm-echo-wrap" hidden>
      <span id="confirm-echo-label">请输入以确认</span>
      <input id="confirm-echo" autocapitalize="off" spellcheck="false">
    </label>
    <div class="modal-actions">
      <button class="btn btn-ghost" value="cancel" type="submit">取消</button>
      <button class="btn btn-danger" value="ok" id="confirm-ok" type="submit">确认</button>
    </div>
  </form>
</dialog>

<script type="module" src="js/main.js"></script>
</body>
</html>
